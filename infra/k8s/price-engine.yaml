apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: price-engine
  template:
    metadata:
      labels:
        app: price-engine
    spec:
      containers:
        - name: price-engine
          image: grainger/price-engine:local
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: pricing-config
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pricing-secrets
                  key: postgres-password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: price-engine
spec:
  selector:
    app: price-engine
  ports:
    - port: 8081
      targetPort: 8081
